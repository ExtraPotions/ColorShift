name: Publish release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching package.json
        required: true
  release:
    types: [published]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - run: npm test
      - name: Upload self-contained userscripts and icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" colorshift-*.user.js assets/*-colorshift-*.png --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: test-results/
