name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: theme-picker-3.1.0
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Upload userscripts and shared helper
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            manapool-theme-picker.user.js \
            scryfall-theme-picker.user.js \
            steamgifts-theme-picker.user.js \
            tcgplayer-theme-picker.user.js \
            theme-picker-common.js \
            assets/theme-picker-icon.png \
            --clobber
