name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: colorshift-0.0.1
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Upload userscripts and shared helper
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            colorshift-manapool.user.js \
            colorshift-scryfall.user.js \
            colorshift-steamgifts.user.js \
            colorshift-tcgplayer.user.js \
            colorshift-cardkingdom.user.js \
            colorshift-goodreads.user.js \
            colorshift-genius.user.js \
            colorshift-common.js \
            manapool-theme-picker.user.js \
            scryfall-theme-picker.user.js \
            steamgifts-theme-picker.user.js \
            tcgplayer-theme-picker.user.js \
            cardkingdom-theme-picker.user.js \
            goodreads-theme-picker.user.js \
            genius-theme-picker.user.js \
            theme-picker-common.js \
            assets/manapool-colorshift-64.png \
            assets/manapool-colorshift-128.png \
            assets/scryfall-colorshift-64.png \
            assets/scryfall-colorshift-128.png \
            assets/steamgifts-colorshift-64.png \
            assets/steamgifts-colorshift-128.png \
            assets/tcgplayer-colorshift-64.png \
            assets/tcgplayer-colorshift-128.png \
            assets/cardkingdom-colorshift-64.png \
            assets/cardkingdom-colorshift-128.png \
            assets/goodreads-colorshift-64.png \
            assets/goodreads-colorshift-128.png \
            assets/genius-colorshift-64.png \
            assets/genius-colorshift-128.png \
            --clobber
